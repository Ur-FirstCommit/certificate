  <body>
    <header class="topbar">

      <span class="channel-label"><span class="signal-dot" aria-hidden="true"></span> SIGNAL LOST</span>

    <main class="not-found" id="main">
      <div class="television-scene" role="img" aria-label="An orange vintage television flickers with a not found screen in front of the number 404.">
        <span class="error-code" aria-hidden="true">404</span>
        <svg class="television" viewBox="0 0 380 300" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffad27" />
              <stop offset=".58" stop-color="#ed8613" />
              <stop offset="1" stop-color="#d96609" />
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#202126" />
              <stop offset="1" stop-color="#08090c" />
            </linearGradient>
            <filter id="static-noise" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="13" />
              <feColorMatrix type="saturate" values="0" />
              <feComponentTransfer>
                <feFuncR type="discrete" tableValues=".02 .98" />
                <feFuncG type="discrete" tableValues=".02 .98" />
                <feFuncB type="discrete" tableValues=".02 .98" />
              </feComponentTransfer>
            </filter>
            <pattern id="scanlines" width="4" height="5" patternUnits="userSpaceOnUse">
              <rect width="4" height="1.2" fill="#090a0d" opacity=".65" />
            </pattern>
          </defs>

          <!-- Antennas sit behind the cabinet. -->
          <g fill="none" stroke="#292929" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
            <path d="M178 105 124 21" />
            <path d="m205 105 60-71" />

            <path d="M153 108c0-20 15-36 34-36s34 16 34 36" />
          </g>

          <!-- Feet and ground line. -->
          <path d="m90 250-5 15h37l-4-15m174 0-4 15h37l-5-15" fill="#373737" stroke="#222" stroke-width="3" />
          <path d="M24 268h332" fill="none" stroke="#242424" stroke-width="2.5" />

          <!-- Rounded orange cabinet. -->
          <rect x="30" y="105" width="320" height="150" rx="19" fill="url(#case)" stroke="#27221d" stroke-width="4" />
          <rect x="36" y="111" width="308" height="138" rx="15" fill="none" stroke="#ffc45c" stroke-width="2" opacity=".85" />

          <!-- Curved CRT glass, moving static, and an animated rolling interference band. -->
          <rect x="43" y="116" width="210" height="127" rx="13" fill="url(#glass)" stroke="#202020" stroke-width="4" />
          <g class="static-layer" clip-path="inset(0 round 12px)">
            <rect class="noise" x="43" y="116" width="210" height="127" filter="url(#static-noise)" opacity=".94" />
            <rect x="43" y="116" width="210" height="127" fill="url(#scanlines)" opacity=".5" />
            <path class="tracking-band" d="M43 150h210v8H43z" fill="#fff" opacity=".18" />
          </g>
          <rect x="43" y="116" width="210" height="127" rx="13" fill="none" stroke="#282828" stroke-width="4" />
          <rect x="98" y="174" width="100" height="22" rx="4" fill="#111" opacity=".92" />
          <text x="148" y="189" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".3">NOT FOUND</text>

          <!-- Tuning panel and knobs. -->
          <path d="M264 116v127" stroke="#a84f0a" stroke-width="2" />
          <circle cx="301" cy="147" r="17" fill="#c66b13" stroke="#472c16" stroke-width="3" />
          <circle cx="301" cy="147" r="12" fill="#54412d" stroke="#211d18" stroke-width="2" />
          <path d="m293 155 16-16" stroke="#1f1a16" stroke-width="3" />
          <circle cx="301" cy="192" r="17" fill="#c66b13" stroke="#472c16" stroke-width="3" />
          <circle cx="301" cy="192" r="12" fill="#54412d" stroke="#211d18" stroke-width="2" />
          <path d="m293 184 16 16" stroke="#1f1a16" stroke-width="3" />
          <g fill="#5b391c" stroke="#231b13" stroke-width="2">
            <circle cx="285" cy="228" r="4.5" /><circle cx="301" cy="228" r="4.5" /><circle cx="317" cy="228" r="4.5" />
          </g>
          <path d="M281 239h39m-39 6h39" stroke="#593313" stroke-width="2.5" />
        </svg>
      </div>

      <section class="message" aria-labelledby="page-title">
        <h1 id="page-title">This page isn’t here.</h1>

        <a class="home-button" href="/">Back to FirstCommit</a>

</html>
